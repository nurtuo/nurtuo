# SPDX-License-Identifier: AGPL-3.0-only
# Snapshot dry-run of the nurtuo runtime release (docs/ARCHITECTURE.md §7.1).
# Built: 6 targets (linux/windows/darwin × amd64/arm64), CGO_ENABLED=0,
# -trimpath, checksums, Syft SPDX SBOMs, deb/rpm.
# TODO(§7.1): cosign keyless signing is skipped (`make snapshot` passes
# --skip=sign). MSI (WiX), macOS notarization, and `bun build --compile` of
# nurtuo-control-plane belong to the tagged release, not this dry-run.
name: release-snapshot
on:
  pull_request:
    paths:
      - ".goreleaser*"
      - ".goreleaser*/**"
      - "Makefile"
      - "core/runtime/**"
      - ".github/workflows/release-snapshot.yml"
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: core/runtime/go.mod

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.3
          install-only: true

      - name: Install Syft
        run: |
          set -euo pipefail
          version=1.57.2
          # sha256 from https://github.com/anchore/syft/releases/download/v1.57.2/syft_1.57.2_checksums.txt
          case "$(uname -m)" in
            x86_64)
              arch=amd64
              sha=ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b
              ;;
            aarch64)
              arch=arm64
              sha=8efe605309c98798e1ee0cffdcf8c05ca26819b4cd44c0b03650f1e963e9bdb6
              ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="syft_${version}_linux_${arch}.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/anchore/syft/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
          echo "${sha}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C "$HOME/.local/bin" syft
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/syft" version

      - name: Snapshot release
        run: make snapshot

      - name: Check snapshot artifacts
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          archives=$(find dist \( -name 'nurtuo_*.tar.gz' -o -name 'nurtuo_*.zip' \) ! -name '*.spdx.json' | wc -l)
          sboms=$(find dist -name 'nurtuo_*.spdx.json' | wc -l)
          debs=$(find dist -name 'nurtuo_*.deb' | wc -l)
          rpms=$(find dist -name 'nurtuo_*.rpm' | wc -l)
          echo "archives=${archives} sboms=${sboms} debs=${debs} rpms=${rpms}"
          find dist -maxdepth 1 -type f -printf '%f\n' | sort
          test "${archives}" -eq 6
          test "${sboms}" -eq 6
          test "${debs}" -eq 2
          test "${rpms}" -eq 2
          for os in linux darwin; do
            for arch in amd64 arm64; do
              test -n "$(find dist -name "nurtuo_*_${os}_${arch}.tar.gz" ! -name '*.spdx.json')"
            done
          done
          for arch in amd64 arm64; do
            test -n "$(find dist -name "nurtuo_*_windows_${arch}.zip" ! -name '*.spdx.json')"
          done
          sbom=$(find dist -name 'nurtuo_*.spdx.json' -print -quit)
          grep -q '"spdxVersion"' "$sbom"
          grep -q 'SPDX-' "$sbom"

          linux_archive=$(find dist -name 'nurtuo_*_linux_amd64.tar.gz' ! -name '*.spdx.json' -print -quit)
          test -n "$linux_archive"
          bindir=$(mktemp -d)
          tar -xzf "$linux_archive" -C "$bindir" nurtuo
          file "$bindir/nurtuo"
          file "$bindir/nurtuo" | grep -q 'statically linked'
          buildinfo=$(go version -m "$bindir/nurtuo")
          printf '%s\n' "$buildinfo"
          printf '%s\n' "$buildinfo" | grep -q 'CGO_ENABLED=0'
          printf '%s\n' "$buildinfo" | grep -q -- '-trimpath=true'

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nurtuo-snapshot-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
