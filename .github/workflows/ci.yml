# SPDX-License-Identifier: AGPL-3.0-only
name: ci
on:
  push: { branches: [main] }
  pull_request:
    # labeled/unlabeled: the proto job reads the `buf skip breaking` label, and the default types
    # (opened, synchronize, reopened) never re-run CI when a label is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/runtime/go.mod
          # No root go.sum: the workspace has one sum per module (go.work).
          cache-dependency-path: |
            core/runtime/go.sum
            sdk/go/go.sum
            connectors/go.sum
      - run: go vet github.com/nurtuo/nurtuo/...
      - run: go test -race github.com/nurtuo/nurtuo/...
      - name: cross-compile runtime (static)
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./core/runtime/cmd/nurtuo
          done
      - uses: golangci/golangci-lint-action@v9
        with: { args: "./core/runtime/... ./sdk/go/... ./connectors/..." }

  # Windows private DACLs for secrets (docs/specs/implemented/2026-11-24-windows-secrets-dacl.md). Not a required
  # check (D13). The required `go` job never compiles Windows-only files, so go-windows-vet does that
  # on Linux and go-windows runs the real ACL tests.
  go-windows-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/runtime/go.mod
          # No root go.sum: the workspace has one sum per module (go.work).
          cache-dependency-path: |
            core/runtime/go.sum
            sdk/go/go.sum
            connectors/go.sum
      - name: GOOS=windows go vet
        working-directory: core/runtime
        env: { GOOS: windows }
        run: go vet ./internal/secrets/... ./cmd/nurtuo/...

  go-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: core/runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/runtime/go.mod
          # No root go.sum: the workspace has one sum per module (go.work).
          cache-dependency-path: |
            core/runtime/go.sum
            sdk/go/go.sum
            connectors/go.sum
      - run: go vet ./internal/secrets/... ./cmd/nurtuo/...
      # No -race: it needs cgo.
      - run: go test -count=1 ./internal/secrets/... ./cmd/nurtuo/...
      # Creates a temporary local user (the hosted runner is an administrator). With the variable set
      # the test fails instead of skipping; the grep also fails the job if it did not run at all.
      - name: TestOtherLocalUserCannotReadSecrets (must run, not skip)
        env: { NURTUO_TEST_WINDOWS_OTHER_USER: "1" }
        run: |
          go test -count=1 -v -run '^TestOtherLocalUserCannotReadSecrets$' ./internal/secrets/ 2>&1 | tee two-user.log
          grep -q -- '--- PASS: TestOtherLocalUserCannotReadSecrets' two-user.log \
            || { echo "::error::TestOtherLocalUserCannotReadSecrets did not pass (skipped or not run)"; exit 1; }

  # nurtuo flow run against a real SFTP server in a container (Docker is preinstalled on ubuntu-latest).
  # Gated by NURTUO_TEST_SFTP_E2E like the Postgres tests are gated by NURTUO_TEST_POSTGRES_URL.
  flow-run-sftp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/runtime/go.mod
          # No root go.sum: the workspace has one sum per module (go.work).
          cache-dependency-path: |
            core/runtime/go.sum
            sdk/go/go.sum
            connectors/go.sum
      - name: TestFlowRunSFTPContainer
        working-directory: core/runtime
        env: { NURTUO_TEST_SFTP_E2E: "1" }
        run: go test -race -count=1 -v -run TestFlowRunSFTPContainer ./test/e2e/...

  # Latency budget: alone on the runner (-p 1, no -race), median p99 of 3 measurements; see docs/perf.md.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/runtime/go.mod
          # No root go.sum: the workspace has one sum per module (go.work).
          cache-dependency-path: |
            core/runtime/go.sum
            sdk/go/go.sum
            connectors/go.sum
      - name: TestPerfBudget
        working-directory: core/runtime
        env: { NURTUO_PERF: "1" }
        run: go test -p 1 -count=1 -v -run TestPerfBudget ./internal/bench

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck build test
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/runtime/go.mod
          cache-dependency-path: |
            core/runtime/go.sum
            sdk/go/go.sum
            connectors/go.sum
      - name: Run host-key socket tests with the real runtime
        shell: bash
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/nurtuo" ./core/runtime/cmd/nurtuo
          NURTUO_FLOW_RUN_BIN="$RUNNER_TEMP/nurtuo" node --test --test-isolation=none --test-reporter=tap \
            --test-name-pattern='^real ' core/control-plane/dist/testrun/hostkey.test.js | tee "$RUNNER_TEMP/hostkey.tap"
          grep -Fx '# fail 0' "$RUNNER_TEMP/hostkey.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/hostkey.tap"
      - name: docs (generated flow reference, example flows, links)
        run: |
          node scripts/gen-flow-reference.mjs --validate --check
          node scripts/check-docs-links.mjs
          node scripts/check-example-operations.mjs

  # Path filter for web-e2e. A job-level filter (not on.pull_request.paths) so every other job still runs
  # on every PR. Only evaluated on pull_request; web-e2e always runs on push to main.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files through the API
    outputs:
      web-e2e: ${{ steps.filter.outputs.web-e2e }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web-e2e:
              - 'core/web/**'
              - 'core/runtime/**'
              - 'sdk/**'
              - 'connectors/**'
              - 'core/deploy/bundle/**'
              - 'examples/flows/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/ci.yml'

  # Playwright e2e for the canvas (core/web/e2e). The flow-run-export spec also runs its exported flow with
  # the real `nurtuo` binary against an atmoz/sftp container (same digest as the Go container e2e), verifying
  # the host key from a known_hosts file (no --insecure-host-key). Not a required check, so it may be skipped:
  # on pull_request it runs only when `changes` reports a matching path; on push to main it always runs.
  web-e2e:
    needs: changes
    # !cancelled() so the skipped `changes` job (push) does not skip this one; cancelled/failed `changes` still skips it.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.web-e2e == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/runtime/go.mod
          # No root go.sum: the workspace has one sum per module (go.work).
          cache-dependency-path: |
            core/runtime/go.sum
            sdk/go/go.sum
            connectors/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --silent --filter @nurtuo/web exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @nurtuo/web exec playwright install chromium
      # OS libraries live outside the browser cache, so they are installed on every run.
      - name: Install Playwright OS dependencies
        run: pnpm --filter @nurtuo/web exec playwright install-deps chromium
      - name: Build nurtuo
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/nurtuo" ./core/runtime/cmd/nurtuo
          echo "NURTUO_FLOW_RUN_BIN=$RUNNER_TEMP/nurtuo" >> "$GITHUB_ENV"
      - name: Start SFTP server, connection file and known_hosts
        run: |
          d="$RUNNER_TEMP/sftp"
          mkdir -p "$d/downloads" && chmod 755 "$d" "$d/downloads"
          # Known exact content, no trailing newline (keeps it safe to pass through the environment).
          expect="version 9.9.${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$expect" > "$d/downloads/version.txt"
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          id="$(docker run -d --name nurtuo-e2e-sftp -p 127.0.0.1::22 -v "$d/downloads:/home/deploy/downloads:ro" \
            atmoz/sftp@sha256:c5fb9e4beb8b7054a4c0b65c5e11df47cc20da95ad6002e88aecff62bab06372 "deploy:$pw:1001")"
          port="$(docker port "$id" 22/tcp | head -n1 | sed 's/.*://')"
          # Wait until sshd answers and has presented its (first-start generated) host keys.
          for i in $(seq 1 60); do
            ssh-keyscan -p "$port" 127.0.0.1 2>/dev/null > "$d/known_hosts" && [ "$(wc -l < "$d/known_hosts")" -ge 3 ] && break
            sleep 1
          done
          if [ "$(wc -l < "$d/known_hosts")" -lt 3 ]; then docker logs "$id" 2>&1 | sed "s/$pw/***/g"; echo "sshd not ready"; exit 1; fi
          printf '{"schema":"nurtuo.connection/v1","id":"private-sftp","connector":"sftp","settings":{"host":"127.0.0.1","port":%s,"user":"deploy","password":"secret://sftp_password"}}\n' "$port" > "$d/conn.json"
          bootstrap_pw="$(openssl rand -hex 16)"
          echo "::add-mask::$bootstrap_pw"
          fingerprint="$("$NURTUO_FLOW_RUN_BIN" flow host-key 127.0.0.1 --port "$port" --json | jq -er '.keys[0].fingerprintSha256')"
          {
            echo "NURTUO_E2E_CP_PASSWORD=$bootstrap_pw"
            echo "NURTUO_CANVAS_RUN_E2E=1"
            echo "NURTUO_TEST_RUN_ALLOW_PRIVATE=1"
            echo "NURTUO_E2E_SFTP_HOST=127.0.0.1"
            echo "NURTUO_E2E_SFTP_PORT=$port"
            echo "NURTUO_E2E_SFTP_USER=deploy"
            echo "NURTUO_E2E_SFTP_PASSWORD=$pw"
            echo "NURTUO_E2E_SFTP_FINGERPRINT=$fingerprint"
            echo "NURTUO_E2E_SFTP_EXPECT=$expect"
            echo "NURTUO_TEST_SFTP_HOST=127.0.0.1"
            echo "NURTUO_TEST_SFTP_PORT=$port"
            echo "NURTUO_TEST_SFTP_USER=deploy"
            echo "NURTUO_TEST_SFTP_PASSWORD=$pw"
            echo "NURTUO_TEST_SFTP_FINGERPRINT=$fingerprint"
            echo "NURTUO_FLOW_RUN_CONN=$d/conn.json"
            echo "NURTUO_FLOW_RUN_KNOWN_HOSTS=$d/known_hosts"
            echo "NURTUO_FLOW_RUN_EXPECT=$expect"
            echo "NURTUO_SECRET_SFTP_PASSWORD=$pw"
          } >> "$GITHUB_ENV"
      - name: Build control plane and test the real runner
        run: |
          pnpm --filter @nurtuo/control-plane... run build
          node --test core/control-plane/dist/testrun/runner.real.test.js
      - name: Playwright e2e
        run: pnpm --filter @nurtuo/web run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            core/web/playwright-report
            core/web/test-results
          retention-days: 5
          if-no-files-found: ignore
      - name: Remove SFTP container
        if: always()
        run: docker rm -f nurtuo-e2e-sftp

  bridge-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/runtime/go.mod
          # No root go.sum: the workspace has one sum per module (go.work).
          cache-dependency-path: |
            core/runtime/go.sum
            sdk/go/go.sum
            connectors/go.sum
      - run: pip install -e "bridges/python[dev]"
      - run: python bridges/python/scripts/gen_proto.py --check
      - run: ruff check bridges/python
      # mypy reads its config (overrides for the partially typed grpc/protobuf) from bridges/python/pyproject.toml.
      - run: mypy src
        working-directory: bridges/python
      - run: pytest bridges/python
      # launcher against the real Python example through contracttest.Run (skipped without NURTUO_TEST_PYTHON)
      - run: go test -race -run 'Python' -v github.com/nurtuo/nurtuo/connectors/bridge
        env: { NURTUO_TEST_PYTHON: python }

  bridge-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "8.0.x" }
      - run: dotnet test bridges/dotnet/Nurtuo.Bridge.Tests

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          # Skipped only for PRs carrying the `buf skip breaking` label (deliberate proto break); lint/format still run.
          breaking: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') }}
          breaking_against: "${{ github.event.repository.clone_url }}#branch=main"
          push: false
          # Default posts a PR comment, which contents:read cannot do, and that fails the job.
          pr_comment: false
      # TODO: regenerate and `git diff --exit-code` to catch stale generated code.

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/runtime/go.mod
          # No root go.sum: the workspace has one sum per module (go.work).
          cache-dependency-path: |
            core/runtime/go.sum
            sdk/go/go.sum
            connectors/go.sum
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: dependency direction + SPDX headers
        run: ./scripts/check-boundaries.sh
      - name: go-licenses (AGPL artifacts)
        run: |
          # v2.0.1 reports the AGPL v3 text as "AGPL-3.0" (see agpl-allow.txt).
          go install github.com/google/go-licenses/v2@v2.0.1
          cd core/runtime && go-licenses check ./... --allowed_licenses="$(grep -v '^#' ../../.github/licenses/agpl-allow.txt | paste -sd, -)"
      - name: go-licenses (Apache artifacts)
        run: |
          for m in sdk/go connectors; do
            (cd $m && go-licenses check ./... --allowed_licenses="$(grep -v '^#' $GITHUB_WORKSPACE/.github/licenses/apache-allow.txt | paste -sd, -)")
          done
      - name: npm licenses (Apache packages, production deps)
        run: |
          for p in sdk/ts/* cli; do
            (cd $p && npx --yes license-checker-rseidelsohn --production --excludePrivatePackages \
              --onlyAllow "$(grep -v '^#' $GITHUB_WORKSPACE/.github/licenses/apache-allow.txt | paste -sd';' -)")
          done
      - name: npm licenses (AGPL packages, production deps)
        run: |
          for p in core/control-plane core/web core/mcp core/ai; do
            (cd $p && npx --yes license-checker-rseidelsohn --production --excludePrivatePackages \
              --onlyAllow "$(grep -v '^#' $GITHUB_WORKSPACE/.github/licenses/agpl-allow.txt | paste -sd';' -)")
          done
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with: { format: spdx-json, artifact-name: sbom.spdx.json }

  # CLA: enforced by the CLA Assistant GitHub App (cla-assistant.io) as a required status check.
