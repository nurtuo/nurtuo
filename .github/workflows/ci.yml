# SPDX-License-Identifier: AGPL-3.0-only
name: ci
on:
  push: { branches: [main] }
  pull_request:
    # labeled/unlabeled: the proto job reads the `buf skip breaking` label, and the default types
    # (opened, synchronize, reopened) never re-run CI when a label is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/runtime/go.mod
          # No root go.sum: the workspace has one sum per module (go.work).
          cache-dependency-path: |
            core/runtime/go.sum
            sdk/go/go.sum
            connectors/go.sum
      - run: go vet github.com/nurtuo/nurtuo/...
      - run: go test -race github.com/nurtuo/nurtuo/...
      - name: cross-compile runtime (static)
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./core/runtime/cmd/nurtuo
          done
      - uses: golangci/golangci-lint-action@v9
        with: { args: "./core/runtime/... ./sdk/go/... ./connectors/..." }

  # Latency budget: alone on the runner (-p 1, no -race), median p99 of 3 measurements; see docs/perf.md.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/runtime/go.mod
          # No root go.sum: the workspace has one sum per module (go.work).
          cache-dependency-path: |
            core/runtime/go.sum
            sdk/go/go.sum
            connectors/go.sum
      - name: TestPerfBudget
        working-directory: core/runtime
        env: { NURTUO_PERF: "1" }
        run: go test -p 1 -count=1 -v -run TestPerfBudget ./internal/bench

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck build test
      - name: docs (generated flow reference, example flows, links)
        run: |
          node scripts/gen-flow-reference.mjs --validate --check
          node scripts/check-docs-links.mjs
          node scripts/check-example-operations.mjs

  bridge-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/runtime/go.mod
          # No root go.sum: the workspace has one sum per module (go.work).
          cache-dependency-path: |
            core/runtime/go.sum
            sdk/go/go.sum
            connectors/go.sum
      - run: pip install -e "bridges/python[dev]"
      - run: python bridges/python/scripts/gen_proto.py --check
      - run: ruff check bridges/python
      # mypy reads its config (overrides for the partially typed grpc/protobuf) from bridges/python/pyproject.toml.
      - run: mypy src
        working-directory: bridges/python
      - run: pytest bridges/python
      # launcher against the real Python example through contracttest.Run (skipped without NURTUO_TEST_PYTHON)
      - run: go test -race -run 'Python' -v github.com/nurtuo/nurtuo/connectors/bridge
        env: { NURTUO_TEST_PYTHON: python }

  bridge-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "8.0.x" }
      - run: dotnet test bridges/dotnet/Nurtuo.Bridge.Tests

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          # Skipped only for PRs carrying the `buf skip breaking` label (deliberate proto break); lint/format still run.
          breaking: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') }}
          breaking_against: "${{ github.event.repository.clone_url }}#branch=main"
          push: false
          # Default posts a PR comment, which contents:read cannot do, and that fails the job.
          pr_comment: false
      # TODO: regenerate and `git diff --exit-code` to catch stale generated code.

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/runtime/go.mod
          # No root go.sum: the workspace has one sum per module (go.work).
          cache-dependency-path: |
            core/runtime/go.sum
            sdk/go/go.sum
            connectors/go.sum
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: dependency direction + SPDX headers
        run: ./scripts/check-boundaries.sh
      - name: go-licenses (AGPL artifacts)
        run: |
          # v2.0.1 reports the AGPL v3 text as "AGPL-3.0" (see agpl-allow.txt).
          go install github.com/google/go-licenses/v2@v2.0.1
          cd core/runtime && go-licenses check ./... --allowed_licenses="$(grep -v '^#' ../../.github/licenses/agpl-allow.txt | paste -sd, -)"
      - name: go-licenses (Apache artifacts)
        run: |
          for m in sdk/go connectors; do
            (cd $m && go-licenses check ./... --allowed_licenses="$(grep -v '^#' $GITHUB_WORKSPACE/.github/licenses/apache-allow.txt | paste -sd, -)")
          done
      - name: npm licenses (Apache packages, production deps)
        run: |
          for p in sdk/ts/* cli; do
            (cd $p && npx --yes license-checker-rseidelsohn --production --excludePrivatePackages \
              --onlyAllow "$(grep -v '^#' $GITHUB_WORKSPACE/.github/licenses/apache-allow.txt | paste -sd';' -)")
          done
      - name: npm licenses (AGPL packages, production deps)
        run: |
          for p in core/control-plane core/web core/mcp core/ai; do
            (cd $p && npx --yes license-checker-rseidelsohn --production --excludePrivatePackages \
              --onlyAllow "$(grep -v '^#' $GITHUB_WORKSPACE/.github/licenses/agpl-allow.txt | paste -sd';' -)")
          done
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with: { format: spdx-json, artifact-name: sbom.spdx.json }

  # CLA: enforced by the CLA Assistant GitHub App (cla-assistant.io) as a required status check.
