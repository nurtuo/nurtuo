# SPDX-License-Identifier: AGPL-3.0-only
# Release of the `nurtuo` runtime binary. Control plane (bun --compile) and bridges have their own jobs.
#
# `make snapshot` is the dry-run (`goreleaser release --snapshot --clean`).
# It builds the six runtime targets below, checksums, and Syft SPDX SBOMs.
# TODO(§7.1): snapshot mode skips cosign keyless signing (`--skip=sign` in the
# Makefile). Real tags sign checksums with cosign via GitHub OIDC.
# TODO(§7.1): MSI (WiX, separate job) and macOS pkg notarization are not
# produced here; they ship from the tagged release workflow.
# TODO(§7.1): `nurtuo-control-plane` is `bun build --compile` in its own job,
# versioned with this runtime. It is not part of this goreleaser config.
version: 2
project_name: nurtuo
snapshot:
  # SemVer-shaped so nfpm accepts the dry-run version. Nothing is published.
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"
builds:
  - id: nurtuo
    dir: core/runtime
    main: ./cmd/nurtuo
    binary: nurtuo
    env: [CGO_ENABLED=0]
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/nurtuo/nurtuo/core/runtime/internal/version.Version={{.Version}}
      - -X github.com/nurtuo/nurtuo/core/runtime/internal/version.Commit={{.Commit}}
      - -X github.com/nurtuo/nurtuo/core/runtime/internal/version.Date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, LICENSING.md, README.md]
checksum:
  name_template: checksums.txt
sboms:
  - id: archives
    artifacts: archive # Syft, SPDX JSON (docs/ARCHITECTURE.md §7.1)
    documents:
      - "{{ .ArtifactName }}.spdx.json"
signs:
  - cmd: cosign # Sigstore keyless (GitHub OIDC). Skipped in snapshot mode.
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum
nfpms:
  - package_name: nurtuo
    description: Nurtuo runtime
    formats: [deb, rpm]
    license: AGPL-3.0-only
    maintainer: Nurtuo <contact@nurtuo.com>
    contents:
      - src: core/deploy/systemd/nurtuo.service
        dst: /lib/systemd/system/nurtuo.service
release:
  github: { owner: nurtuo, name: nurtuo }
  draft: true
